<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 12" width="1000" height="12" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#8a8a8e" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#8a8a8e" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8a8a8e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <style>
      .run { animation: run 3.4s linear infinite; }
      @keyframes run {
        from { transform: translateX(-300px); }
        to   { transform: translateX(1000px); }
      }
      @media (prefers-reduced-motion: reduce) { .run { animation: none; opacity: 0; } }
    </style>
  </defs>
  <rect x="0" y="5" width="1000" height="2" fill="url(#base)"/>
  <rect class="run" x="0" y="5" width="300" height="2" fill="url(#pulse)"/>
</svg>
